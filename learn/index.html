<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>辅助学习</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--c:#1a1a2e;--card:#1e2a3a;--gold:#f0c040;--text:#eee;--muted:#aaa;}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--c);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
main{text-align:center;max-width:500px}
.icon{font-size:4em;margin-bottom:20px;opacity:.6}
h1{font-size:1.8em;margin-bottom:16px;background:linear-gradient(90deg,#f0c040,#e94560);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{color:var(--muted);line-height:1.8;margin-bottom:30px}
.coming{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:24px;margin-bottom:30px}
.coming-tag{display:inline-block;padding:6px 16px;border-radius:50px;background:linear-gradient(90deg,var(--gold),#e94560);color:var(--c);font-size:.85em;font-weight:600}
.back a{color:var(--gold);text-decoration:none}
.back a:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
  <span class="icon">🎓</span>
  <h1>辅助学习</h1>
  <div class="coming">
    <span class="coming-tag">功能开发中</span>
  </div>
  <p>本模块将提供中医学习辅助功能，包括背诵记忆、测验练习等，敬请期待。</p>
  <div class="back"><a href="../index.html">← 返回首页</a></div>
</main>
</body>
</html>
