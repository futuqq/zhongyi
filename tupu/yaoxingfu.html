.warm .dot{background:#b5451b}
.cold .dot{background:#2d6a4f}
.neutral .dot{background:#6a0572}

main{padding:24px 16px 60px;max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{border-radius:var(--radius);padding:20px;background:var(--card);border:1px solid rgba(255,255,255,.06);transition:transform .25s,box-shadow .25s;cursor:default;animation:fadeUp .4s ease both}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.card-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.code{min-width:46px;height:36px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72em;font-weight:800;flex-shrink:0;color:#fff;line-height:1.2}

</style>

const catPrefix={cold:"1",hot:"2",warm:"3",neutral:"4"};
const catLabels={cold:"寒",hot:"热",warm:"温",neutral:"平"};
const catNames={cold:"寒性药",hot:"热性药",warm:"温性药",neutral:"平性药"};
const grid=document.getElementById("grid"),empty=document.getElementById("empty"),searchInput=document.getElementById("search");
let curCat="all";
function buildCard(h,i){
  const delay=i*18,code=catPrefix[h.cat]+"-"+String(h.seq).padStart(2,"0");
  return `<div class="card" style="animation-delay:${delay}ms"><div class="card-top"><div class="code ${h.cat}"><span class="cat-num">${catLabels[h.cat]}</span><span class="seq-num">${String(h.seq).padStart(2,"0")}</span></div><div class="title-wrap"><div class="card-title">${h.name}</div><div class="card-pinyin">${h.pinyin}</div></div></div><div class="card-desc">${h.desc}</div><div style="margin-top:10px"><span class="tag ${h.cat}">${code} · ${catNames[h.cat]}</span></div></div>`;
}
function render(){
  const q=searchInput.value.trim().toLowerCase(),filtered=herbs.filter(h=>{const mc=curCat==="all"||h.cat===curCat,mq=!q||h.name.toLowerCase().includes(q)||h.pinyin.toLowerCase().includes(q)||h.desc.toLowerCase().includes(q);return mc&&mq;});
  if(filtered.length===0){grid.style.display="none";empty.style.display="block";}else{grid.style.display="";empty.style.display="none";grid.innerHTML=filtered.map((h,i)=>buildCard(h,i)).join("");}
}
document.querySelectorAll(".stat").forEach(btn=>{btn.addEventListener("click",()=>{document.querySelectorAll(".stat").forEach(b=>b.classList.remove("active"));btn.classList.add("active");curCat=btn.dataset.cat;render();});});
searchInput.addEventListener("input",render);
render();
</script>
